name: Manual multi-account title lookup experiment
on:
  workflow_dispatch:
    inputs:
      slug:
        type: string
        default: missing-80
      model:
        type: string
        default: gemini-2.5-flash
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests Pillow opencc-python-reimplemented
      - name: Probe accounts and resolve missing titles without publication
        env:
          YDC_API_KEYI_1: ${{ secrets.YDC_API_KEYI_1 }}
          YDC_API_KEYI_2: ${{ secrets.YDC_API_KEYI_2 }}
          YDC_API_KEY_3: ${{ secrets.YDC_API_KEY_3 }}
          YDC_API_KEY_4: ${{ secrets.YDC_API_KEY_4 }}
          TAVILY_API_KEY_1: ${{ secrets.TAVILY_API_KEY_1 }}
          TAVILY_API_KEY_2: ${{ secrets.TAVILY_API_KEY_2 }}
          TAVILY_API_KEY_3: ${{ secrets.TAVILY_API_KEY_3 }}
          TAVILY_API_KEY_4: ${{ secrets.TAVILY_API_KEY_4 }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        run: python scripts/title_api_experiment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: title-api-experiment
          path: logs/title-api-experiment.json
          if-no-files-found: error
          retention-days: 7
