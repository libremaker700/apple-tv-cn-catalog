name: Verify mainland titles and synopses
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum unresolved works to examine (0-5)
        type: string
        default: '3'
      slug:
        description: Optional one official Apple slug for a targeted check
        type: string
        default: ''
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: apple-catalog
  cancel-in-progress: false
jobs:
  titles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install requests Pillow opencc-python-reimplemented
      - run: python -m unittest discover -s tests -v
      - name: You.com names, independent page identity, then source comparison
        id: lookup
        env:
          YDC_API_KEYI_1: ${{ secrets.YDC_API_KEYI_1 }}
          YDC_API_KEYI_2: ${{ secrets.YDC_API_KEYI_2 }}
          YDC_API_KEY_1: ${{ secrets.YDC_API_KEY_1 }}
          YDC_API_KEY_2: ${{ secrets.YDC_API_KEY_2 }}
          YDC_API_KEY_3: ${{ secrets.YDC_API_KEY_3 }}
          YDC_API_KEY_4: ${{ secrets.YDC_API_KEY_4 }}
          TAVILY_API_KEY_1: ${{ secrets.TAVILY_API_KEY_1 }}
          TAVILY_API_KEY_2: ${{ secrets.TAVILY_API_KEY_2 }}
          TAVILY_API_KEY_3: ${{ secrets.TAVILY_API_KEY_3 }}
          TAVILY_API_KEY_4: ${{ secrets.TAVILY_API_KEY_4 }}
          TITLE_LOOKUP_LIMIT: ${{ inputs.limit || vars.TITLE_LOOKUP_LIMIT || '3' }}
          TARGET_SLUG: ${{ inputs.slug }}
        run: |
          ARGS=(--limit "$TITLE_LOOKUP_LIMIT")
          if [ -n "$TARGET_SLUG" ]; then ARGS+=(--slug "$TARGET_SLUG" --force); fi
          python scripts/mainland_names.py "${ARGS[@]}"
      - name: Preserve completed requests and budget reservations
        if: always() && steps.lookup.outcome != 'skipped'
        run: |
          git config user.name catalog-bot
          git config user.email catalog-bot@users.noreply.github.com
          for FILE in data/mainland-name-cache.json data/source-cache.json logs/mainland-name-sync.json; do if [ -f "$FILE" ]; then git add "$FILE"; fi; done
          git diff --cached --quiet || git commit -m 'catalog: preserve independent title-search reservations'
          git push
      - run: python scripts/catalog.py --validate
      - run: python scripts/home_sync.py --validate
      - name: Persist verified metadata and account diagnostics
        run: |
          git config user.name catalog-bot
          git config user.email catalog-bot@users.noreply.github.com
          git add docs data/mainland-name-cache.json data/source-cache.json logs/mainland-name-sync.json
          git diff --cached --quiet || git commit -m 'catalog: publish independently verified mainland names'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
