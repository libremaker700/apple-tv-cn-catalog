name: Verify mainland titles and synopses
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum unresolved works to examine (0-5)
        type: string
        default: '3'
      slug:
        description: Optional one official Apple slug for a targeted check
        type: string
        default: ''
      pending_only:
        description: Recheck missing Chinese names only; no playback source probing
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: apple-catalog
  cancel-in-progress: false
jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime, os
          day = datetime.datetime.now(datetime.timezone.utc).date()
          due = os.environ['EVENT'] != 'schedule' or (day - datetime.date(2026, 11, 1)).days % 3 == 0
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('due=' + str(due).lower() + '\n')
          PY
  titles:
    needs: cadence
    if: needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install requests Pillow opencc-python-reimplemented cryptography
      - run: python -m unittest discover -s tests -v
      - name: Direct Douban names and sources, then verified search fallback
        id: lookup
        env:
          APPLETV_SHARED_SESSION_JSON: ${{ secrets.APPLETV_SHARED_SESSION_JSON }}
          APPLETV_JUZI_PROTOCOL_JSON: ${{ secrets.APPLETV_JUZI_PROTOCOL_JSON }}
          YDC_API_KEYI_1: ${{ secrets.YDC_API_KEYI_1 }}
          YDC_API_KEYI_2: ${{ secrets.YDC_API_KEYI_2 }}
          YDC_API_KEYI_3: ${{ secrets.YDC_API_KEYI_3 }}
          YDC_API_KEYI_4: ${{ secrets.YDC_API_KEYI_4 }}
          YDC_API_KEYI: ${{ secrets.YDC_API_KEYI }}
          YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
          YDC_API_KEY_1: ${{ secrets.YDC_API_KEY_1 }}
          YDC_API_KEY_2: ${{ secrets.YDC_API_KEY_2 }}
          YDC_API_KEY_3: ${{ secrets.YDC_API_KEY_3 }}
          YDC_API_KEY_4: ${{ secrets.YDC_API_KEY_4 }}
          TAVILY_API_KEY_1: ${{ secrets.TAVILY_API_KEY_1 }}
          TAVILY_API_KEY_2: ${{ secrets.TAVILY_API_KEY_2 }}
          TAVILY_API_KEY_3: ${{ secrets.TAVILY_API_KEY_3 }}
          TAVILY_API_KEY_4: ${{ secrets.TAVILY_API_KEY_4 }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TITLE_LOOKUP_LIMIT: ${{ inputs.limit || vars.TITLE_LOOKUP_LIMIT || '3' }}
          TARGET_SLUG: ${{ inputs.slug }}
          PENDING_ONLY: ${{ inputs.pending_only }}
        run: |
          if [ "$PENDING_ONLY" = "true" ]; then
            python scripts/refresh_identity_targets.py
            REVIEW_ARGS=(--limit 64)
            if [ -n "$TARGET_SLUG" ]; then
              IFS=',' read -ra TARGETS <<< "$TARGET_SLUG"
              for TARGET in "${TARGETS[@]}"; do REVIEW_ARGS+=(--slug "$TARGET"); done
            fi
            python scripts/pending_name_review.py "${REVIEW_ARGS[@]}"
            exit 0
          fi
          ARGS=(--limit "$TITLE_LOOKUP_LIMIT")
          if [ -n "$TARGET_SLUG" ]; then ARGS+=(--slug "$TARGET_SLUG" --force); fi
          python scripts/mainland_names.py "${ARGS[@]}"
      - name: Verify pending playback availability in GitHub
        if: inputs.pending_only != true
        env:
          APPLETV_SHARED_SESSION_JSON: ${{ secrets.APPLETV_SHARED_SESSION_JSON }}
          APPLETV_JUZI_PROTOCOL_JSON: ${{ secrets.APPLETV_JUZI_PROTOCOL_JSON }}
          TARGET_SLUG: ${{ inputs.slug }}
        run: |
          ARGS=(--limit 3)
          if [ -n "$TARGET_SLUG" ]; then ARGS+=(--slug "$TARGET_SLUG"); fi
          python scripts/source_availability.py "${ARGS[@]}"
      - name: Preserve completed requests and budget reservations
        if: always() && steps.lookup.outcome != 'skipped'
        run: |
          git config user.name catalog-bot
          git config user.email catalog-bot@users.noreply.github.com
          for FILE in data/mainland-name-cache.json data/detail-metadata-cache.json data/source-cache.json data/home-season-cache.json logs/identity-season-refresh.json logs/mainland-name-sync.json data/cloud-source-cache.json logs/cloud-source-checks.json; do if [ -f "$FILE" ]; then git add "$FILE"; fi; done
          git diff --cached --quiet || git commit -m 'catalog: preserve independent title-search reservations'
          git push
      - run: python scripts/catalog.py --validate
      - run: python scripts/home_sync.py --validate
      - name: Persist verified metadata and account diagnostics
        run: |
          git config user.name catalog-bot
          git config user.email catalog-bot@users.noreply.github.com
          git add docs data/mainland-name-cache.json data/source-cache.json logs/mainland-name-sync.json
          if [ -f data/detail-metadata-cache.json ]; then git add data/detail-metadata-cache.json; fi
          git diff --cached --quiet || git commit -m 'catalog: publish independently verified mainland names'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
