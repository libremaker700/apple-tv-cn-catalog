name: Calibrate Chinese titles with search API
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum unresolved works to examine (0-20)
        type: string
        default: '12'
      slug:
        description: Optional one official Apple slug for a targeted check
        type: string
        default: ''
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: apple-catalog
  cancel-in-progress: false
jobs:
  titles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests Pillow opencc-python-reimplemented
      - run: python -m unittest discover -s tests -v
      - name: Reuse verified names and search unresolved works within one shared budget
        id: lookup
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_KEY_1: ${{ secrets.TAVILY_API_KEY_1 }}
          TAVILY_API_KEY_2: ${{ secrets.TAVILY_API_KEY_2 }}
          TITLE_LOOKUP_LIMIT: ${{ inputs.limit || vars.TITLE_LOOKUP_LIMIT || '12' }}
          TITLE_LOOKUP_MONTHLY_LIMIT: ${{ vars.TITLE_LOOKUP_MONTHLY_LIMIT || '100' }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          TARGET_SLUG: ${{ inputs.slug }}
        run: |
          ARGS=()
          if [ "$MANUAL_RUN" = 'true' ]; then ARGS+=(--force); fi
          if [ -n "$TARGET_SLUG" ]; then ARGS+=(--slug "$TARGET_SLUG"); fi
          python scripts/title_lookup.py "${ARGS[@]}"
      - name: Preserve search reservations even if a later operation fails
        if: always() && steps.lookup.outcome != 'skipped'
        run: |
          if [ -f data/title-cache.json ]; then
            git config user.name catalog-bot
            git config user.email catalog-bot@users.noreply.github.com
            git add data/title-cache.json
            git diff --cached --quiet || git commit -m 'catalog: preserve title search cache and shared budget'
            git push
          fi
      - run: python scripts/catalog.py --validate
      - name: Persist verified aliases and public search diagnostics
        run: |
          git config user.name catalog-bot
          git config user.email catalog-bot@users.noreply.github.com
          git add data/title-cache.json logs/title-lookup.json docs
          git diff --cached --quiet || git commit -m 'catalog: publish source-verified Chinese titles and aliases'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
