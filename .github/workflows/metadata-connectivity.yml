name: Diagnose public metadata connection
on: workflow_dispatch
permissions: {}
jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Read-only transport diagnostics without account credentials
        run: |
          python - <<'PY'
          import json,socket,urllib.request,urllib.error,requests
          urls=['https://m.douban.com/rexxar/api/v2/tv/37457350','https://movie.douban.com/j/subject_suggest?q=To%20Mom%20And%20Dad%20With%20Love']
          headers={'User-Agent':'Mozilla/5.0','Referer':'https://m.douban.com/','Accept':'application/json'}
          for host in ['m.douban.com','movie.douban.com']:
              try:print(json.dumps({'stage':'dns','host':host,'addresses':len(socket.getaddrinfo(host,443))}),flush=True)
              except Exception as e:print(json.dumps({'stage':'dns','host':host,'error':type(e).__name__,'errno':getattr(e,'errno',None)}),flush=True)
          for url in urls:
              host=urllib.request.urlparse(url).hostname if hasattr(urllib.request,'urlparse')else url.split('/')[2]
              try:
                  r=requests.get(url,headers=headers,timeout=(6,15),allow_redirects=False)
                  print(json.dumps({'stage':'requests','host':host,'status':r.status_code,'bytes':len(r.content)}),flush=True)
              except Exception as e:
                  print(json.dumps({'stage':'requests','host':host,'error':type(e).__name__,'cause':type(e.__cause__).__name__,'argsTypes':[type(a).__name__ for a in e.args]}),flush=True)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=15)as r:print(json.dumps({'stage':'urllib','host':host,'status':r.status,'bytes':len(r.read(512001))}),flush=True)
              except urllib.error.HTTPError as e:print(json.dumps({'stage':'urllib','host':host,'status':e.code}),flush=True)
              except Exception as e:print(json.dumps({'stage':'urllib','host':host,'error':type(e).__name__,'reason':type(getattr(e,'reason',None)).__name__}),flush=True)
          PY
