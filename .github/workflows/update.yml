name: Update Apple TV catalog and images
on:
  push:
    branches: [main]
  schedule:
    - cron: '37 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [sync, home, publish]
        default: sync
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: apple-catalog
  cancel-in-progress: false
jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime, os
          day = datetime.datetime.now(datetime.timezone.utc).date()
          due = os.environ['EVENT'] != 'schedule' or (day - datetime.date(2026, 11, 1)).days % 3 == 0
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('due=' + str(due).lower() + '\n')
          PY
  publish:
    needs: cadence
    if: needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests Pillow opencc-python-reimplemented cryptography
      - run: python -m unittest discover -s tests -v
      - name: Collect originals with verified season discovery
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'sync')
        run: python scripts/catalog.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Upgrade undersized library artwork in a bounded cloud batch
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'sync')
        run: python scripts/list_artwork.py --apply --limit 12 --workers 3 --publish
      - run: python scripts/catalog.py --validate
      - name: Update official homepage and topic pages with verified images
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'sync' || inputs.mode == 'home'))
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          HOME_COPY_MODEL: ${{ vars.HOME_COPY_MODEL }}
        run: python scripts/home_sync.py
      - name: Translate shared official work synopses once
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          HOME_COPY_MODEL: ${{ vars.HOME_COPY_MODEL }}
        run: python scripts/work_summaries.py
      - name: Translate changed official homepage copy
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 || secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          HOME_COPY_MODEL: ${{ vars.HOME_COPY_MODEL }}
        run: python scripts/home_copy.py
      - run: python scripts/home_sync.py --validate
      - name: Commit validated data and image files
        run: |
          git config user.name catalog-bot
          git config user.email catalog-bot@users.noreply.github.com
          git add docs data/season-cache.json data/home-image-cache.json
          if [ -f data/home-logo-cache.json ]; then git add data/home-logo-cache.json; fi
          for FILE in data/home-work-cache.json data/home-season-cache.json data/home-title-cache.json data/source-cache.json data/official-pages-cache.json data/home-copy-cache.json logs/home-copy.json data/genre-translation-cache.json data/work-summary-cache.json data/work-original-cache.json logs/work-summaries.json data/list-artwork-cache.json logs/list-artwork.json; do if [ -f "$FILE" ]; then git add "$FILE"; fi; done
          git diff --cached --quiet || git commit -m 'catalog: update verified metadata and images'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
