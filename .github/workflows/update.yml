name: Update Apple TV catalog and images
on:
  push:
    branches: [main]
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [sync, publish]
        default: sync
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: apple-catalog
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests Pillow opencc-python-reimplemented
      - run: python -m unittest discover -s tests -v
      - name: Collect daily with verified season discovery
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'sync')
        run: python scripts/catalog.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - run: python scripts/catalog.py --validate
      - name: Commit validated data and image files
        run: |
          git config user.name catalog-bot
          git config user.email catalog-bot@users.noreply.github.com
          git add docs data/season-cache.json
          git diff --cached --quiet || git commit -m 'catalog: update verified metadata and images'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
